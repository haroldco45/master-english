<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master English - VIBRAS POSITIVAS HM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <header class="bg-indigo-700 text-white p-6 shadow-lg text-center">
        <h1 class="text-2xl font-bold uppercase">English Perfect PWA</h1>
        <p class="text-xs mt-1">Un proyecto de: <strong>VIBRAS POSITIVAS HM</strong></p>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <div id="setup-screen" class="bg-white p-8 rounded-3xl shadow-xl text-center mt-10">
            <h2 class="text-xl font-bold mb-4 text-indigo-700">¡Bienvenido!</h2>
            <p class="text-gray-600 mb-6 italic">Haz clic abajo para cargar los ejercicios del documento.</p>
            <button onclick="startApp()" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold w-full shadow-lg">
                CARGAR EJERCICIOS
            </button>
        </div>

        <div id="game-screen" class="hidden bg-white rounded-3xl shadow-xl overflow-hidden mt-4 border border-gray-200">
            <div class="p-8">
                <div class="flex justify-between items-center mb-4">
                    <span id="block-tag" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full"></span>
                    <span id="counter" class="text-gray-400 font-bold text-sm"></span>
                </div>
                <p id="instruction" class="text-gray-500 text-xs italic mb-2"></p>
                <p id="question-text" class="text-xl font-bold text-gray-800 mb-6"></p>

                <input type="text" id="user-input" class="w-full p-4 border-2 border-gray-200 rounded-xl mb-4 focus:border-indigo-500 outline-none">
                <button onclick="checkAnswer()" id="btn-check" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">VERIFICAR</button>
                
                <div id="feedback" class="mt-4 hidden p-4 rounded-xl font-medium text-center border-2"></div>
                <button onclick="loadNext()" id="btn-next" class="hidden mt-4 w-full bg-black text-white py-4 rounded-xl font-bold">CONTINUAR ➔</button>
            </div>
        </div>
    </main>

    <footer class="mt-10 text-center text-gray-400 text-xs">
        <p>© 2026 <strong>VIBRAS POSITIVAS HM</strong></p>
    </footer>

    <script>
        const database = [
            { b: "BLOQUE 1", i: "Completa con have o has", q: "I __________ finished my work.", a: "have", r: "Usamos 'have' para I, You, We, They." },
            { b: "BLOQUE 1", i: "Completa con have o has", q: "She __________ gone to the store.", a: "has", r: "She es 3ª persona singular, requiere 'has'." },
            { b: "BLOQUE 2", i: "Completa con for o since", q: "I have lived here __________ 2010.", a: "since", r: "Usamos 'since' para un momento exacto." },
            { b: "BLOQUE 3", i: "Completa con already o yet", q: "Have you finished your homework __________?", a: "yet", r: "Yet se usa al final de preguntas." },
            { b: "BLOQUE 5", i: "Past Simple o Present Perfect", q: "I __________ (see) that movie last night.", a: "saw", r: "Last night indica Past Simple." }
        ];

        let current = 0;

        function startApp() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            render();
        }

        function render() {
            const data = database[current];
            document.getElementById('block-tag').innerText = data.b;
            document.getElementById('instruction').innerText = data.i;
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('counter').innerText = `${current + 1} / ${database.length}`;
            document.getElementById('user-input').value = "";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-check').classList.remove('hidden');
        }

        function checkAnswer() {
            const userVal = document.getElementById('user-input').value.trim().toLowerCase();
            const correctVal = database[current].a.toLowerCase();
            const feedback = document.getElementById('feedback');

            feedback.classList.remove('hidden');
            if (userVal === correctVal) {
                feedback.innerHTML = "¡VIBRAS POSITIVAS HM! 🌟<br>Excelente respuesta.";
                feedback.className = "mt-4 p-4 rounded-xl border-2 bg-green-50 border-green-500 text-green-700 font-bold";
            } else {
                feedback.innerHTML = "NORMA: " + database[current].r;
                feedback.className = "mt-4 p-4 rounded-xl border-2 bg-red-50 border-red-500 text-red-700";
            }
            document.getElementById('btn-check').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function loadNext() {
            current++;
            if (current < database.length) render();
            else alert("¡Entrenamiento completado por Vibras Positivas HM!");
        }
    </script>
</body>
</html>
